name: Release Smart FormSense v17.20.0 thoughts

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/.sfs-thought-release-trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v17.20.0 thought experience
        run: python scripts/release_v17_20_thoughts.py

      - name: Syntax and release checks
        shell: bash
        run: |
          node --check Smart_Form_Filler.user.js
          grep -Fq '// @version      17.20.0' Smart_Form_Filler.user.js
          grep -Fq "const SCRIPT_VERSION = '17.20.0';" Smart_Form_Filler.user.js
          grep -Fq "const THOUGHT_ROTATE_MS = 4 * 60 * 60 * 1000;" Smart_Form_Filler.user.js
          grep -Fq 'id="creatorThought"' Smart_Form_Filler.user.js
          grep -Fq 'id="thoughtShuffle"' Smart_Form_Filler.user.js
          grep -Fq '❤️ <strong>Akash Singh</strong> · <span id="creatorEmail"></span>' Smart_Form_Filler.user.js
          if grep -Fq 'Created with love ❤️ <strong>Akash Singh</strong> · <span id="creatorEmail"></span>' Smart_Form_Filler.user.js; then
            echo 'Old main-panel creator line is still present'
            exit 1
          fi
          if grep -Eq "trackAnalytics\([^\n]*thought|thought[^\n]*trackAnalytics" Smart_Form_Filler.user.js; then
            echo 'Thought feature must not be tracked in PostHog'
            exit 1
          fi

      - name: Commit production release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Smart_Form_Filler.user.js
          if git diff --cached --quiet; then
            echo 'No production changes to commit'
            exit 0
          fi
          git commit -m 'feat: add rotating Smart FormSense thoughts v17.20.0'
          git push origin main
