name: Validate Smart FormSense v17.29

on:
  push:
    branches:
      - sfs-v17-29-minimize-position

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check Smart_Form_Filler.user.js

      - name: Version and product invariants
        shell: bash
        run: |
          grep -Fq "// @version      17.29.0" Smart_Form_Filler.user.js
          grep -Fq "const SCRIPT_VERSION = '17.29.0';" Smart_Form_Filler.user.js
          grep -Fq "const BRIDGE_MARKER = '__STFF_V17_7_BRIDGE__';" Smart_Form_Filler.user.js
          grep -Fq "const FEEDBACK_ENDPOINT = 'https://formspree.io/f/xbgjvoaw';" Smart_Form_Filler.user.js
          grep -Fq "const POSTHOG_HOST = 'https://eu.i.posthog.com';" Smart_Form_Filler.user.js
          grep -Fq "const UPDATE_INFO_URL = 'https://api.greasyfork.org/en/scripts/592133.json';" Smart_Form_Filler.user.js

      - name: Minimize positioning regression checks
        shell: bash
        run: |
          grep -Fq "const resetHostPosition = () => {" Smart_Form_Filler.user.js
          grep -Fq "'panel-minimized'" Smart_Form_Filler.user.js
          grep -Fq "anchor:" Smart_Form_Filler.user.js
          grep -Fq "'bottom-right'" Smart_Form_Filler.user.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('Smart_Form_Filler.user.js').read_text(encoding='utf-8')
          direct_position_writes = re.findall(r'host\.style\.(?:left|right|top|bottom)\s*=', text)
          if direct_position_writes:
              raise SystemExit(f'Unprotected host position writes remain: {direct_position_writes}')
          direct_display_writes = re.findall(r'host\.style\.display\s*=(?!=)', text)
          if direct_display_writes:
              raise SystemExit(f'Unprotected host display writes remain: {direct_display_writes}')
          required = [
              "setHostStyle(\n        'left',\n        'auto'",
              "setHostStyle(\n        'right',\n        '8px'",
              "setHostStyle(\n        'bottom',\n        '8px'",
              "setHostStyle(\n        'display',\n        'none'"
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'Missing protected runtime style update: {needle}')
          PY

      - name: Documentation checks
        shell: bash
        run: |
          grep -Fq "**17.29.0**" README.md
          grep -Fq "## 17.29.0" CHANGELOG.md
