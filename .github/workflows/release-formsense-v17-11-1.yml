name: One-time Smart FormSense v17.11.1 reliability release

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release/v17-11-1-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v17.11.1 reliability patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/release-v17-11-1/patch.part* | base64 -d | gunzip > /tmp/patch_v17_11_1.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/patch_v17_11_1.py')
          x = p.read_text(encoding='utf-8')
          start = x.index('# Critical bug: journey button discovery must return a list.')
          end = x.index('# Add partial-report helpers before the functional report builder.', start)
          replacement = """# Critical bug: journey button discovery must return a list.\nassert 'const nodes = [...document.querySelector(' in s, 'journey querySelector anchor missing'\ns = s.replace('const nodes = [...document.querySelector(', 'const nodes = [...document.querySelectorAll(', 1)\n\n"""
          p.write_text(x[:start] + replacement + x[end:], encoding='utf-8')
          PY
          python -m py_compile /tmp/patch_v17_11_1.py
          python /tmp/patch_v17_11_1.py

      - name: Validate production userscript
        shell: bash
        run: |
          set -euo pipefail
          node --check Smart_Form_Filler.user.js
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('Smart_Form_Filler.user.js').read_text(encoding='utf-8')
          assert '// @name         Smart FormSense' in s
          assert '// @version      17.11.1' in s
          assert '// @match        *://*/*' in s
          assert '@noframes' not in s
          assert '.submit(' not in s
          assert '.requestSubmit(' not in s
          assert s.count('meritto') == 1
          assert 'akash.singh@meritto.com' in s
          occurrences = len(re.findall(r'\bcommitSelectedRadioGroups\s*\(', s))
          declarations = len(re.findall(r'\bfunction\s+commitSelectedRadioGroups\s*\(', s))
          assert occurrences == declarations, (occurrences, declarations)
          assert "const nodes = [...document.querySelectorAll(" in s
          assert "const nodes = [...document.querySelector(" not in s
          assert 'qaMarkReportIncomplete' in s
          assert 'qaFallbackPartialReport' in s
          assert 'runState' in s
          assert 'fieldsChecked' in s
          assert 'Partial Report' in s
          assert 'qaProgressBox' in s
          assert 'qaProgressBar' in s
          assert 'qaProgressPct' in s
          assert 'qaProgressText' in s
          assert '■ Stop QA' in s
          assert 'setQaProgress' in s
          assert 'REMOTE_QA_PROGRESS' in s
          assert re.search(r'QA_REMOTE_COMMAND_TIMEOUT_MS\s*=\s*300000', s)
          assert 'id="qaDebugBtn"' in s
          assert 'id="qaDebugBtn" disabled' not in s
          assert "productVersion:\n        '17.11.1'" in s or "productVersion: '17.11.1'" in s
          assert 'qaRunJourneyChecks' in s
          assert 'qaRunDependencyChain' in s
          assert 'final submit/payment' in s.lower() or 'final submit, payment' in s.lower()
          print('Smart FormSense v17.11.1 validation passed')
          PY

      - name: Publish and remove one-time updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Akash"
          git config user.email "avydgupta1234@gmail.com"
          git rm .github/workflows/release-formsense-v17-11-1.yml
          git rm -f .github/release-v17-11-1/patch.py.gz.b64
          git rm -f .github/release-v17-11-1/patch.part01
          git rm -f .github/release-v17-11-1/patch.part02
          git rm -f .github/release-v17-11-1/patch.part03
          git rm -f .github/release-v17-11-1/patch.part04
          git rm -f .github/release-v17-11-1/patch.part05
          git add Smart_Form_Filler.user.js
          git commit -m "Release Smart FormSense v17.11.1"
          git push origin main
