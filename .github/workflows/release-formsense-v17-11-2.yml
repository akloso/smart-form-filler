name: One-time Smart FormSense v17.11.2 QA progress fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release/v17-11-2-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix QA progress plumbing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('Smart_Form_Filler.user.js')
          s = p.read_text(encoding='utf-8')
          assert '// @version      17.11.1' in s

          s = s.replace('// @version      17.11.1', '// @version      17.11.2', 1)
          s = s.replace('Smart FormSense V17.11.1', 'Smart FormSense V17.11.2')
          s = s.replace("productVersion: '17.11.1'", "productVersion: '17.11.2'")
          s = s.replace("productVersion:\n        '17.11.1'", "productVersion:\n        '17.11.2'")
          s = s.replace("qa.productVersion || '17.11.1'", "qa.productVersion || '17.11.2'")

          child_start = s.index('  const installFrameAgent = () => {')
          child_end = s.index('  const mountPanel = () => {', child_start)
          child = s[child_start:child_end]

          wrong = """\n      setQaProgress(percent, text) {\n        const value = clamp(Number(percent || 0), 0, 100);\n        state.qaProgressPercent = value;\n        if (refs.qaProgressBar) refs.qaProgressBar.style.width = `${value}%`;\n        if (refs.qaProgressPct) refs.qaProgressPct.textContent = `${Math.round(value)}%`;\n        if (refs.qaProgressText) refs.qaProgressText.textContent = text || 'Working…';\n      },\n"""
          assert wrong in child, 'duplicate child QA progress method not found'
          child = child.replace(wrong, '\n', 1)
          s = s[:child_start] + child + s[child_end:]

          top_start = s.index('  const mountPanel = () => {')
          top_anchor = """      setQaReport(report) {\n        if (!report) return;"""
          top_index = s.index(top_anchor, top_start)
          top_method = """      setQaProgress(percent, text) {\n        const value = clamp(Number(percent || 0), 0, 100);\n        state.qaProgressPercent = value;\n        if (refs.qaProgressBar) refs.qaProgressBar.style.width = `${value}%`;\n        if (refs.qaProgressPct) refs.qaProgressPct.textContent = `${Math.round(value)}%`;\n        if (refs.qaProgressText) refs.qaProgressText.textContent = text || 'Working…';\n      },\n\n"""
          s = s[:top_index] + top_method + s[top_index:]

          p.write_text(s, encoding='utf-8')
          print('v17.11.2 QA progress plumbing fixed')
          PY

      - name: Validate production userscript
        shell: bash
        run: |
          set -euo pipefail
          node --check Smart_Form_Filler.user.js
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('Smart_Form_Filler.user.js').read_text(encoding='utf-8')

          assert '// @version      17.11.2' in s
          assert '// @match        *://*/*' in s
          assert '@noframes' not in s
          assert '.submit(' not in s
          assert '.requestSubmit(' not in s
          assert s.count('meritto') == 1
          assert 'akash.singh@meritto.com' in s

          occurrences = len(re.findall(r'\bcommitSelectedRadioGroups\s*\(', s))
          declarations = len(re.findall(r'\bfunction\s+commitSelectedRadioGroups\s*\(', s))
          assert occurrences == declarations

          assert s.count('      setQaProgress(percent, text) {') == 2
          child_start = s.index('  const installFrameAgent = () => {')
          child_end = s.index('  const mountPanel = () => {', child_start)
          child = s[child_start:child_end]
          top = s[child_end:]
          assert child.count('      setQaProgress(percent, text) {') == 1
          assert 'REMOTE_QA_PROGRESS' in child
          assert 'refs.qaProgressBar' not in child
          assert top.count('      setQaProgress(percent, text) {') == 1
          assert 'refs.qaProgressBar' in top
          assert 'refs.qaProgressPct' in top
          assert 'refs.qaProgressText' in top

          assert 'qaProgressBox' in s
          assert 'qaProgressBar' in s
          assert '■ Stop QA' in s
          assert 'qaMarkReportIncomplete' in s
          assert 'qaFallbackPartialReport' in s
          assert 'Completed checks will remain exportable' in s
          assert 'id="qaDebugBtn" disabled' not in s
          assert 'const nodes = [...document.querySelectorAll(' in s
          assert re.search(r'QA_REMOTE_COMMAND_TIMEOUT_MS\s*=\s*300000', s)
          print('Smart FormSense v17.11.2 validation passed')
          PY

      - name: Publish and remove one-time updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Akash"
          git config user.email "avydgupta1234@gmail.com"
          git rm .github/workflows/release-formsense-v17-11-2.yml
          git add Smart_Form_Filler.user.js
          git commit -m "Release Smart FormSense v17.11.2"
          git push origin main
