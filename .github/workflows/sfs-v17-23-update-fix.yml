name: Smart FormSense v17.23.0 update-flow fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sfs-v17-23-update-fix.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply update-flow fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          script_path = Path('Smart_Form_Filler.user.js')
          text = script_path.read_text(encoding='utf-8')

          old_version = '17.22.0'
          new_version = '17.23.0'

          if text.count(old_version) < 4:
              raise SystemExit(f'Expected multiple {old_version} references in production userscript')

          text = text.replace(old_version, new_version)

          share_line = "  const SHARE_INSTALL_URL = 'https://greasyfork.org/en/scripts/592133-smart-form-filler';"
          if 'const UPDATE_INSTALL_URL = SHARE_INSTALL_URL;' not in text:
              if text.count(share_line) != 1:
                  raise SystemExit('Expected one SHARE_INSTALL_URL declaration')
              text = text.replace(
                  share_line,
                  share_line + "\n  const UPDATE_INSTALL_URL = SHARE_INSTALL_URL;",
                  1
              )

          open_pattern = re.compile(
              r"""  const openUserscriptUpdate = \(\) => \{.*?\n  \};""",
              re.S
          )
          open_replacement = "\n".join([
              "  const openUserscriptUpdate = () => {",
              "    try {",
              "      GM_openInTab(UPDATE_INSTALL_URL, { active: true, insert: true, setParent: true });",
              "      return true;",
              "    } catch {",
              "      try { window.open(UPDATE_INSTALL_URL, '_blank', 'noopener,noreferrer'); return true; } catch {}",
              "    }",
              "    return false;",
              "  };"
          ])
          text, count = open_pattern.subn(open_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not patch raw-GitHub update opener')

          render_pattern = re.compile(
              r"""    const renderUpdateStatus = \(\) => \{.*?\n    \};\n\n    const updateUpdateIndicator""",
              re.S
          )
          render_replacement = """    const renderUpdateStatus = () => {
              const info = currentUpdateInfo();
              const available = updateAvailableFrom(info?.latestVersion || '');
              if (refs.currentVersionText) refs.currentVersionText.textContent = `v${SCRIPT_VERSION}`;
              if (refs.latestVersionText) refs.latestVersionText.textContent = info?.latestVersion ? `v${info.latestVersion}` : '—';
              if (refs.updateStatusText) {
                refs.updateStatusText.textContent = info?.error
                  ? 'Last update check was unavailable.'
                  : available
                    ? `Update available: v${info.latestVersion}`
                    : info?.latestVersion
                      ? 'Smart FormSense is up to date.'
                      : 'No update check has run yet.';
              }
              if (refs.updateNowSettings) refs.updateNowSettings.classList.toggle('visible', available);
            };

            const updateUpdateIndicator"""
          text, count = render_pattern.subn(render_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not patch renderUpdateStatus')

          return_pattern = re.compile(
              r"""    const maybeShowUpdateReloadAfterReturn = \(\) => \{.*?\n    \};\n\n    const beginUpdateInstallFlow""",
              re.S
          )
          return_replacement = """    const maybeShowUpdateReloadAfterReturn = async () => {
              if (!updateInstallAwaitingReturn || document.hidden) return;
              const elapsed = Date.now() - updateInstallOpenedAt;
              if (elapsed < 700) {
                setTimeout(maybeShowUpdateReloadAfterReturn, 750 - elapsed);
                return;
              }

              updateInstallAwaitingReturn = false;

              try {
                const info = await checkForUpdates({ force: true, silent: true });
                state.panel?.updateUpdateIndicator?.(info);
              } catch {}

              state.panel?.notify?.(
                'Update page returned',
                `If you completed the Tampermonkey update, reload this page to activate it. This page is still running v${SCRIPT_VERSION}.`,
                'warning'
              );
            };

            const beginUpdateInstallFlow"""
          text, count = return_pattern.subn(return_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not patch post-update return flow')

          begin_pattern = re.compile(
              r"""    const beginUpdateInstallFlow = event => \{.*?\n    \};\n\n    const resetFeedbackForm""",
              re.S
          )
          begin_replacement = """    const beginUpdateInstallFlow = event => {
              try { event?.preventDefault?.(); } catch {}
              try { event?.stopPropagation?.(); } catch {}

              const info = currentUpdateInfo();
              if (info?.latestVersion && !updateAvailableFrom(info.latestVersion)) {
                updateUpdateIndicator(info);
                state.panel?.notify?.(
                  'Smart FormSense is up to date',
                  `This page is already running v${SCRIPT_VERSION}.`,
                  'success'
                );
                return;
              }

              if (!openUserscriptUpdate()) {
                state.panel?.notify?.(
                  'Update could not be opened',
                  'Open the Smart FormSense Greasy Fork page and update from there.',
                  'error'
                );
                return;
              }

              updateInstallAwaitingReturn = true;
              updateInstallOpenedAt = Date.now();

              state.panel?.notify?.(
                'Greasy Fork opened',
                'Complete the update in Tampermonkey. After installation, return here and reload this page.',
                'success'
              );
            };

            const resetFeedbackForm"""
          text, count = begin_pattern.subn(begin_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not patch update-start flow')

          script_path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_readme = """**17.22.0**

          v17.22.0 is a maintenance/documentation release. Runtime behavior remains based on the compact v17.21.0 production release; the production source metadata was refreshed and an outdated analytics comment was corrected to match the already-live PostHog configuration."""
          new_readme = """**17.23.0**

          v17.23.0 fixes the in-product update flow. Smart FormSense now sends users to the Greasy Fork installation/update page instead of trying to open the raw GitHub userscript as an installer, prevents stale update actions from being shown as actionable, and no longer assumes that returning from the update page means an update was successfully installed."""
          if old_readme not in readme:
              raise SystemExit('Expected v17.22 README current-version block')
          readme = readme.replace(old_readme, new_readme, 1)
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = "## 17.22.0\n"
          entry = """## 17.23.0

          Update-flow reliability fix.

          - Changed the in-product **Update Smart FormSense** action to open the public Greasy Fork page instead of the raw GitHub userscript URL
          - Kept GitHub raw source only for lightweight version checking
          - Recomputed update visibility from the current runtime version instead of trusting stale cached availability state
          - Prevented a stale/invalid update action from opening when Smart FormSense is already current
          - Removed the false assumption that returning from the update tab means installation succeeded
          - After returning from Greasy Fork, Smart FormSense now tells the user to reload only if they actually completed the Tampermonkey update
          - Existing form-filling, QA, safety, analytics, sharing, iframe, Stop, Undo, and final-submit protection behavior is unchanged

          """
          if marker not in changelog:
              raise SystemExit('Expected v17.22 changelog marker')
          changelog = changelog.replace(marker, entry + marker, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          updated = script_path.read_text(encoding='utf-8')
          if old_version in updated:
              raise SystemExit('Old production version remains in userscript')
          if '// @version      17.23.0' not in updated:
              raise SystemExit('Userscript metadata version was not updated')
          if "const SCRIPT_VERSION = '17.23.0';" not in updated:
              raise SystemExit('SCRIPT_VERSION was not updated')
          if 'const UPDATE_INSTALL_URL = SHARE_INSTALL_URL;' not in updated:
              raise SystemExit('Greasy Fork update URL binding missing')
          if 'GM_openInTab(UPDATE_INSTALL_URL' not in updated:
              raise SystemExit('Update action does not use Greasy Fork')
          if 'GM_openInTab(`${UPDATE_RAW_URL}?install=' in updated:
              raise SystemExit('Old raw-GitHub install action still present')
          if "const UPDATE_RAW_URL = 'https://raw.githubusercontent.com/akloso/smart-form-filler/main/Smart_Form_Filler.user.js';" not in updated:
              raise SystemExit('Version-check source changed unexpectedly')
          PY

      - name: Syntax and invariant checks
        shell: bash
        run: |
          node --check Smart_Form_Filler.user.js
          git diff --check
          grep -Fq "// @name         Smart FormSense" Smart_Form_Filler.user.js
          grep -Fq "// @version      17.23.0" Smart_Form_Filler.user.js
          grep -Fq "const SCRIPT_VERSION = '17.23.0';" Smart_Form_Filler.user.js
          grep -Fq "const UPDATE_INSTALL_URL = SHARE_INSTALL_URL;" Smart_Form_Filler.user.js
          grep -Fq "const BRIDGE_MARKER = '__STFF_V17_7_BRIDGE__';" Smart_Form_Filler.user.js
          grep -Fq "const FEEDBACK_ENDPOINT = 'https://formspree.io/f/xbgjvoaw';" Smart_Form_Filler.user.js
          grep -Fq "const POSTHOG_HOST = 'https://eu.i.posthog.com';" Smart_Form_Filler.user.js
          grep -Fq "**17.23.0**" README.md
          grep -Fq "## 17.23.0" CHANGELOG.md

      - name: Commit production release and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sfs-v17-23-update-fix.yml
          git add Smart_Form_Filler.user.js README.md CHANGELOG.md
          git commit -m "fix: release Smart FormSense v17.23.0 update flow"
          git push origin HEAD:main
