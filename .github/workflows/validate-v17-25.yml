name: Validate Smart FormSense v17.25

on:
  push:
    branches:
      - sfs-v17-25-iframe-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax and invariant checks
        shell: bash
        run: |
          node --check Smart_Form_Filler.user.js
          grep -Fq "// @version      17.25.0" Smart_Form_Filler.user.js
          grep -Fq "const SCRIPT_VERSION = '17.25.0';" Smart_Form_Filler.user.js
          grep -Fq "const BRIDGE_MARKER = '__STFF_V17_7_BRIDGE__';" Smart_Form_Filler.user.js
          grep -Fq "const FEEDBACK_ENDPOINT = 'https://formspree.io/f/xbgjvoaw';" Smart_Form_Filler.user.js
          grep -Fq "const POSTHOG_HOST = 'https://eu.i.posthog.com';" Smart_Form_Filler.user.js
          grep -Fq "const REMOTE_AGENT_ACK_TIMEOUT_MS = 1200;" Smart_Form_Filler.user.js
          grep -Fq "const REMOTE_AGENT_WATCHDOG_MS = 4500;" Smart_Form_Filler.user.js
          grep -Fq "const isolatePanelEvent =" Smart_Form_Filler.user.js
          grep -Fq "Embedded form closed or became unavailable. Reopen the form and try again." Smart_Form_Filler.user.js
          grep -Fq "**17.25.0**" README.md
          grep -Fq "## 17.25.0" CHANGELOG.md
