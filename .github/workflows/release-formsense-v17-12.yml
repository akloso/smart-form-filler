name: One-time Smart FormSense v17.12 QA coverage upgrade

on:
  pull_request:
    paths:
      - '.github/release-v17-12/trigger.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Smart FormSense
        run: |
          python3 -m py_compile .github/release-v17-12/patch.py
          python3 .github/release-v17-12/patch.py

      - name: Validate production userscript
        run: |
          node --check Smart_Form_Filler.user.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Smart_Form_Filler.user.js').read_text(encoding='utf-8')
          checks = {
              'version': '// @version      17.12.0' in s,
              'dynamic discovery': 'qaRunDiscoverySweep' in s,
              'slow dependency wait': 'qaWaitForDependentSelect' in s,
              'manual progression prompt': 'Manual step: click Continue / Submit on the form' in s,
              'final missed-field sweep': 'Final full-form missed-field sweep' in s,
              'friendly report fields covered': 'FIELDS COVERED' in s,
              'friendly report action section': 'What you still need to check' in s,
              'field coverage metric': 'fieldCoverage' in s,
              'all-sites match': '@match        *://*/*' in s,
              'iframes preserved': '@noframes' not in s,
              'no requestSubmit': '.requestSubmit(' not in s,
              'no direct submit': '.submit(' not in s,
              'old score label removed': 'FUNCTIONAL QA SCORE' not in s,
              'old auto coverage removed': 'AUTO COVERAGE' not in s,
              'debug version fixed': "productVersion:\n        '17.9.0'" not in s and "productVersion: '17.9.0'" not in s,
              'radio helper definition preserved once': s.count('commitSelectedRadioGroups(') == 1,
              'meritto privacy invariant': s.count('meritto') == 1,
              'creator email preserved': 'akash.singh@meritto.com' in s,
          }
          for name, ok in checks.items():
              print(f"{'PASS' if ok else 'FAIL'}: {name}")
          print('commitSelectedRadioGroups count =', s.count('commitSelectedRadioGroups('))
          print('meritto count =', s.count('meritto'))
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Validation failed: ' + ', '.join(failed))
          PY

      - name: Publish and remove one-time updater
        run: |
          rm -rf .github/release-v17-12
          rm -f .github/workflows/release-formsense-v17-12.yml
          git config user.name 'Akash'
          git config user.email 'avydgupta1234@gmail.com'
          git add Smart_Form_Filler.user.js .github
          git commit -m 'Release Smart FormSense v17.12.0'
          git push origin HEAD:main
