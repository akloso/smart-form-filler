name: One-time Smart FormSense v17.11 applicant-journey QA release

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release/v17-11-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v17.11 QA patches
        shell: bash
        run: |
          set -euo pipefail
          python .github/release-v17-11/patch_core.py
          python .github/release-v17-11/patch_severity.py
          python .github/release-v17-11/patch_report_v3.py

      - name: Validate production userscript
        shell: bash
        run: |
          set -euo pipefail
          node --check Smart_Form_Filler.user.js
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('Smart_Form_Filler.user.js').read_text(encoding='utf-8')
          assert '// @version      17.11.0' in s
          assert '// @name         Smart FormSense' in s
          assert '// @match        *://*/*' in s
          assert '@noframes' not in s
          assert '.submit(' not in s
          assert '.requestSubmit(' not in s
          assert s.count('meritto') == 1
          assert 'akash.singh@meritto.com' in s
          occurrences = len(re.findall(r'\bcommitSelectedRadioGroups\s*\(', s))
          declarations = len(re.findall(r'\bfunction\s+commitSelectedRadioGroups\s*\(', s))
          assert occurrences == declarations
          assert 'qaAttemptUserEntry' in s
          assert 'qaRunJourneyChecks' in s
          assert 'qaRunDependencyChain' in s
          assert 'Final submission protection' in s
          assert 'Blockers</span>' in s
          assert 'ISSUE TYPES' in s
          assert 'final submit/payment stays protected' in s
          assert "productVersion: '17.11.0'" in s
          assert "status === 'blocker'" in s
          assert "status === 'failed'" in s
          assert "? 'critical'" in s
          assert "? 'warning'" in s
          assert 'Similar findings are grouped into one issue with affected fields listed.' in s
          assert 'qaGroupedFindings' in s
          print('Smart FormSense v17.11 validation passed')
          PY

      - name: Publish and remove one-time updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Akash"
          git config user.email "avydgupta1234@gmail.com"
          git rm .github/workflows/release-formsense-v17-11.yml
          git rm -f .github/release-v17-11/upgrade.py.gz.b64
          git rm -f .github/release-v17-11/trigger.txt
          git rm .github/release-v17-11/patch_core.py
          git rm -f .github/release-v17-11/patch_report.py
          git rm -f .github/release-v17-11/patch_report_v2.py
          git rm .github/release-v17-11/patch_report_v3.py
          git rm .github/release-v17-11/patch_severity.py
          git add Smart_Form_Filler.user.js
          git commit -m "Release Smart FormSense v17.11.0"
          git push origin main
