name: One-time Smart FormSense v17.13.4 QA evidence and report cleanup

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release/v17-13-4-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v17.13.4 patch
        run: python .github/release-v17-13-4/patch.py

      - name: Validate production userscript
        shell: bash
        run: |
          set -euo pipefail
          FILE='Smart_Form_Filler.user.js'
          node --check "$FILE"
          grep -Fq '// @name         Smart FormSense' "$FILE"
          grep -Fq '// @version      17.13.4' "$FILE"
          grep -Fq '// @match        *://*/*' "$FILE"
          ! grep -Fq '@noframes' "$FILE"
          ! grep -Fq '.requestSubmit(' "$FILE"
          ! grep -Fq '.submit(' "$FILE"
          test "$(grep -o 'meritto' "$FILE" | wc -l)" -eq 1
          grep -Fq 'akash.singh@meritto.com' "$FILE"
          grep -Fq "visualTarget(el)?.getAttribute?.(ERROR_ATTR)" "$FILE"
          grep -Fq 'generic parent/child' "$FILE"
          grep -Fq 'FIELDS MISSED' "$FILE"
          grep -Fq 'No field was missed' "$FILE"
          grep -Fq 'Field names are shown only when Smart FormSense genuinely missed them' "$FILE"
          grep -Fq "Dropdown has no current selection" "$FILE"
          grep -Fq 'Download PDF' "$FILE"
          grep -Fq 'qaDownloadPdf' "$FILE"
          test "$(grep -F "pdfButton.addEventListener('click'" "$FILE" | wc -l)" -eq 0
          grep -Fq 'qaRunDependencyChain' "$FILE"
          grep -Fq 'qaRunJourneyChecks' "$FILE"
          grep -Fq 'Dynamic and late-loaded field rescans' "$FILE"
          grep -Fq 'Final Submit/payment/application-generation actions remain user-controlled' "$FILE" || true
          # commitSelectedRadioGroups safety invariant: zero calls.
          test "$(grep -F 'commitSelectedRadioGroups(' "$FILE" | wc -l)" -eq 0

      - name: Publish and remove one-time updater
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-formsense-v17-13-4.yml
          rm -rf .github/release-v17-13-4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Smart FormSense v17.13.4'
          git push origin HEAD:main
