name: Configure Smart FormSense v17.19.0 analytics

on:
  push:
    branches:
      - sfs-v17-19-0-staging
    paths:
      - .github/workflows/apply-v17-19-staging.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: sfs-v17-19-0-staging
          fetch-depth: 0

      - name: Configure approved PostHog analytics
        run: python scripts/configure_v17_19_analytics.py

      - name: Syntax and invariant checks
        shell: bash
        run: |
          node --check Smart_Form_Filler.user.js
          grep -q "// @version      17.19.0" Smart_Form_Filler.user.js
          grep -q "const SCRIPT_VERSION = '17.19.0';" Smart_Form_Filler.user.js
          grep -q "Share Smart FormSense" Smart_Form_Filler.user.js
          grep -q "Developer Mode disabled" Smart_Form_Filler.user.js
          grep -q "const POSTHOG_PROJECT_KEY = 'phc_tvkpunebfKwWRdUttkbJ4ZdphYmpeJaqj3MnZ7mP67c8';" Smart_Form_Filler.user.js
          grep -q "const POSTHOG_HOST = 'https://eu.i.posthog.com';" Smart_Form_Filler.user.js
          grep -q "// @connect      eu.i.posthog.com" Smart_Form_Filler.user.js
          grep -q '\$process_person_profile: false' Smart_Form_Filler.user.js
          grep -q "hostname: location.hostname || ''" Smart_Form_Filler.user.js
          if grep -q "commitSelectedRadioGroups" Smart_Form_Filler.user.js; then
            echo "Forbidden legacy function found"
            exit 1
          fi
          if grep -q "@noframes" Smart_Form_Filler.user.js; then
            echo "@noframes must not be introduced"
            exit 1
          fi

      - name: Commit configured candidate
        shell: bash
        run: |
          if git diff --quiet -- Smart_Form_Filler.user.js; then
            echo "No userscript changes to commit"
            exit 0
          fi
          git config user.name "Smart FormSense Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Smart_Form_Filler.user.js
          git commit -m "chore: configure Smart FormSense v17.19.0 analytics"
          git push origin HEAD:sfs-v17-19-0-staging
