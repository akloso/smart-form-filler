name: Stage Smart FormSense v17.19.0

on:
  push:
    branches:
      - sfs-v17-19-0-staging
    paths:
      - .github/workflows/apply-v17-19-staging.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: sfs-v17-19-0-staging
          fetch-depth: 0

      - name: Apply approved Smart FormSense changes
        run: python scripts/stage_v17_19.py

      - name: Syntax and invariant checks
        shell: bash
        run: |
          node --check Smart_Form_Filler.user.js
          grep -q "// @version      17.19.0" Smart_Form_Filler.user.js
          grep -q "const SCRIPT_VERSION = '17.19.0';" Smart_Form_Filler.user.js
          grep -q "Share Smart FormSense" Smart_Form_Filler.user.js
          grep -q "Developer Mode disabled" Smart_Form_Filler.user.js
          grep -q "POSTHOG_PROJECT_KEY = ''" Smart_Form_Filler.user.js
          if grep -q "commitSelectedRadioGroups" Smart_Form_Filler.user.js; then
            echo "Forbidden legacy function found"
            exit 1
          fi
          if grep -q "@noframes" Smart_Form_Filler.user.js; then
            echo "@noframes must not be introduced"
            exit 1
          fi

      - name: Commit staged candidate
        shell: bash
        run: |
          if git diff --quiet -- Smart_Form_Filler.user.js; then
            echo "No userscript changes to commit"
            exit 0
          fi
          git config user.name "Smart FormSense Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Smart_Form_Filler.user.js
          git commit -m "feat: stage Smart FormSense v17.19.0 sharing and analytics"
          git push origin HEAD:sfs-v17-19-0-staging
