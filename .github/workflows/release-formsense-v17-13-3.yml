name: One-time Smart FormSense v17.13.3 button binding fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release/v17-13-3-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Smart FormSense
        run: python .github/release-v17-13-3/patch.py

      - name: Validate production userscript
        shell: bash
        run: |
          set -euo pipefail
          node --check Smart_Form_Filler.user.js
          grep -Fq '// @version      17.13.3' Smart_Form_Filler.user.js
          grep -Fq '// @name         Smart FormSense' Smart_Form_Filler.user.js
          grep -Fq '// @match        *://*/*' Smart_Form_Filler.user.js
          ! grep -Fq '@noframes' Smart_Form_Filler.user.js
          ! grep -Fq 'refs.qaRefreshBtn.onclick' Smart_Form_Filler.user.js
          grep -Fq 'bindQaAction(refs.qaExportBtn' Smart_Form_Filler.user.js
          grep -Fq 'bindQaAction(refs.qaDebugBtn' Smart_Form_Filler.user.js
          grep -Fq 'id="qaExportBtn"' Smart_Form_Filler.user.js
          grep -Fq 'id="qaDebugBtn"' Smart_Form_Filler.user.js
          grep -Fq "window.open('about:blank', '_blank')" Smart_Form_Filler.user.js
          grep -Fq '// @grant        GM_download' Smart_Form_Filler.user.js
          grep -Fq 'typeof GM_download' Smart_Form_Filler.user.js
          ! grep -Fq '.requestSubmit(' Smart_Form_Filler.user.js
          ! grep -Fq '.submit(' Smart_Form_Filler.user.js
          test "$(grep -o 'meritto' Smart_Form_Filler.user.js | wc -l)" -eq 1
          grep -Fq 'akash.singh@meritto.com' Smart_Form_Filler.user.js
          test "$(grep -o 'commitSelectedRadioGroups(' Smart_Form_Filler.user.js | wc -l)" -eq 0
          grep -Fq 'Created with love ❤️ Akash Singh' Smart_Form_Filler.user.js

      - name: Publish and remove one-time updater
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/release-v17-13-3/patch.py
          rm -f .github/release-v17-13-3/trigger.txt
          rmdir .github/release-v17-13-3 2>/dev/null || true
          rm -f .github/workflows/release-formsense-v17-13-3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Smart FormSense v17.13.3'
          git push origin HEAD:main
