name: One-time Smart FormSense v17.8 direct release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-formsense-v17-8.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Build validated v17.8 from production source and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir work
          cd work
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"

          curl -fsSL "$base/Smart_Form_Filler.user.js" -o Smart_Form_Filler.user.js
          curl -fsSL "$base/.github/release-direct/builder.gz.b64.00" -o builder.00
          curl -fsSL "$base/.github/release-direct/builder.gz.b64.01" -o builder.01
          curl -fsSL "$base/.github/release-direct/builder.gz.b64.02" -o builder.02

          cat builder.00 builder.01 builder.02 > builder.gz.b64
          echo "0b73b9a3a5ae7d2cbb7f82a2666a1b45447f1ad5720157c75ad938f02769ee22  builder.gz.b64" | sha256sum -c -

          base64 --decode builder.gz.b64 > builder.py.gz
          gzip --decompress --stdout builder.py.gz > build_formsense_17_8.py
          echo "d06d30cbd67d7b50e23bf87bb04cf7512733c313b625c5c5fe871854acb9d30f  build_formsense_17_8.py" | sha256sum -c -

          python3 build_formsense_17_8.py

          node --check Smart_Form_Filler.user.js
          grep -Fq "// @name         Smart FormSense" Smart_Form_Filler.user.js
          grep -Fq "// @version      17.8.0" Smart_Form_Filler.user.js
          grep -Fq "Intelligent Form Filling & QA Testing" Smart_Form_Filler.user.js
          grep -Fq "Run QA Audit" Smart_Form_Filler.user.js
          grep -Fq "// @match        *://*/*" Smart_Form_Filler.user.js

          if grep -Fq "// @noframes" Smart_Form_Filler.user.js; then
            echo "Unexpected @noframes found."
            exit 1
          fi

          if grep -En '\.(submit|requestSubmit)[[:space:]]*\(' Smart_Form_Filler.user.js; then
            echo "Unexpected final-submit API found."
            exit 1
          fi

          test "$(grep -ci 'meritto' Smart_Form_Filler.user.js)" -eq 1
          grep -Fq "akash.singh@meritto.com" Smart_Form_Filler.user.js
          test "$(grep -c 'commitSelectedRadioGroups' Smart_Form_Filler.user.js)" -eq 1

          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/Smart_Form_Filler.user.js?ref=main" --jq '.sha')"
          encoded="$(base64 -w0 Smart_Form_Filler.user.js)"

          jq -n \
            --arg message "Release Smart FormSense v17.8.0" \
            --arg content "$encoded" \
            --arg sha "$sha" \
            --arg branch "main" \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' \
            > /tmp/payload.json

          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/Smart_Form_Filler.user.js" \
            --input /tmp/payload.json \
            >/dev/null

          echo "Smart FormSense v17.8.0 published to main."
