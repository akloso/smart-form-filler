name: Release Smart FormSense v17.8.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-formsense-v17-8.yml"
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate release
        shell: bash
        run: |
          set -euo pipefail
          cat .github/release/formsense_v17_8.part* > /tmp/formsense_v17_8.patch.b64
          base64 --decode /tmp/formsense_v17_8.patch.b64 > /tmp/formsense_v17_8.patch
          git apply --check /tmp/formsense_v17_8.patch
          git apply /tmp/formsense_v17_8.patch
          node --check Smart_Form_Filler.user.js
          grep -Fq "// @name         Smart FormSense" Smart_Form_Filler.user.js
          grep -Fq "// @version      17.8.0" Smart_Form_Filler.user.js
          if grep -En '\.(submit|requestSubmit)[[:space:]]*\(' Smart_Form_Filler.user.js; then
            echo "Unexpected final-submit API found."
            exit 1
          fi
          test "$(grep -ci 'meritto' Smart_Form_Filler.user.js)" -eq 1
          grep -Fq "akash.singh@meritto.com" Smart_Form_Filler.user.js
          test "$(grep -c 'commitSelectedRadioGroups' Smart_Form_Filler.user.js)" -eq 1

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/release/formsense_v17_8.part*
          rmdir .github/release 2>/dev/null || true
          git config user.name "Smart FormSense Release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Release Smart FormSense v17.8.0 [skip ci]"
          git push origin HEAD:main
