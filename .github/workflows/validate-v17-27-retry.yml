name: Validate Smart FormSense v17.27 retry

on:
  push:
    branches:
      - sfs-v17-27-random-debug-access

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: node --check Smart_Form_Filler.user.js

      - name: Version and product invariants
        shell: bash
        run: |
          grep -Fq "// @version      17.27.0" Smart_Form_Filler.user.js
          grep -Fq "const SCRIPT_VERSION = '17.27.0';" Smart_Form_Filler.user.js
          grep -Fq "const BRIDGE_MARKER = '__STFF_V17_7_BRIDGE__';" Smart_Form_Filler.user.js
          grep -Fq "const FEEDBACK_ENDPOINT = 'https://formspree.io/f/xbgjvoaw';" Smart_Form_Filler.user.js
          grep -Fq "const POSTHOG_HOST = 'https://eu.i.posthog.com';" Smart_Form_Filler.user.js
          grep -Fq "const UPDATE_INFO_URL = 'https://api.greasyfork.org/en/scripts/592133.json';" Smart_Form_Filler.user.js

      - name: Randomization checks
        shell: bash
        run: |
          grep -Fq "const refreshSyntheticProfile =" Smart_Form_Filler.user.js
          grep -Fq "synthetic-profile-refreshed" Smart_Form_Filler.user.js
          grep -Fq "const stableSyntheticInt =" Smart_Form_Filler.user.js
          grep -Fq "const stableSyntheticPick =" Smart_Form_Filler.user.js
          grep -Fq "const seededOption =" Smart_Form_Filler.user.js

      - name: Access guidance checks
        shell: bash
        run: |
          grep -Fq "Automatic startup checks are diagnostic only" Smart_Form_Filler.user.js
          grep -Fq "Embedded form could not be reached" Smart_Form_Filler.user.js
          grep -Fq "If this is already enabled" Smart_Form_Filler.user.js

      - name: Debug checks
        shell: bash
        run: |
          grep -Fq "reportVersion: 2" Smart_Form_Filler.user.js
          grep -Fq "embeddedAccess," Smart_Form_Filler.user.js
          grep -Fq "accepted/rejected counts represent active operational fields" Smart_Form_Filler.user.js
          grep -Fq "Smart_FormSense_V" Smart_Form_Filler.user.js
          if grep -Fq "Auto_Form_Filler_Auto_QA_Testing_V17_11_1_Debug" Smart_Form_Filler.user.js; then
            echo "Old debug filename still present"
            exit 1
          fi

      - name: Documentation checks
        shell: bash
        run: |
          grep -Fq "**17.27.0**" README.md
          grep -Fq "## 17.27.0" CHANGELOG.md
