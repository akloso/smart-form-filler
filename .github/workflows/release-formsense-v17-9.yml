name: One-time Smart FormSense v17.9 release

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Release Smart FormSense v17.9.0'
    runs-on: ubuntu-latest
    steps:
      - name: Build, validate and publish v17.9
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir work
          cd work
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"

          curl -fsSL "$base/Smart_Form_Filler.user.js" -o Smart_Form_Filler.user.js
          curl -fsSL "$base/.github/release-v17-9/build.part00" -o build.part00
          curl -fsSL "$base/.github/release-v17-9/build.part01" -o build.part01

          cat build.part00 build.part01 > updater.py.gz.b64
          echo "5be60c5aee7480b280283677282dc48c985dcd35db0a8a03a3483c65830ec2fc  updater.py.gz.b64" | sha256sum -c -

          base64 --decode updater.py.gz.b64 > updater.py.gz
          gzip --decompress --stdout updater.py.gz > build_formsense_17_9.py
          echo "855e1f3c77ffbd62277d8a3530c6a043f1e00a3c26ac1d48515cad9d56353952  build_formsense_17_9.py" | sha256sum -c -

          python3 build_formsense_17_9.py
          echo "8c83e9cf2f9f8e3df8806e7b49702bd85161ce0a2a26734248a6366217287827  Smart_Form_Filler.user.js" | sha256sum -c -

          node --check Smart_Form_Filler.user.js
          grep -Fq "// @name         Smart FormSense" Smart_Form_Filler.user.js
          grep -Fq "// @version      17.9.0" Smart_Form_Filler.user.js
          grep -Fq "Intelligent Form Filling & QA Testing" Smart_Form_Filler.user.js
          grep -Fq "Run QA Audit" Smart_Form_Filler.user.js
          grep -Fq "Export Debug" Smart_Form_Filler.user.js
          grep -Fq "Smart_FormSense_QA_Report_" Smart_Form_Filler.user.js
          grep -Fq "text/html;charset=utf-8" Smart_Form_Filler.user.js
          grep -Fq "// @match        *://*/*" Smart_Form_Filler.user.js

          if grep -Fq "// @noframes" Smart_Form_Filler.user.js; then
            echo "Unexpected @noframes found."
            exit 1
          fi

          if grep -En '\.(submit|requestSubmit)[[:space:]]*\(' Smart_Form_Filler.user.js; then
            echo "Unexpected final-submit API found."
            exit 1
          fi

          test "$(grep -ci 'meritto' Smart_Form_Filler.user.js)" -eq 1
          grep -Fq "akash.singh@meritto.com" Smart_Form_Filler.user.js
          test "$(grep -c 'commitSelectedRadioGroups' Smart_Form_Filler.user.js)" -eq 1

          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/Smart_Form_Filler.user.js?ref=main" --jq '.sha')"
          base64 -w0 Smart_Form_Filler.user.js > /tmp/content.b64

          jq -n \
            --arg message "Release Smart FormSense v17.9.0" \
            --arg sha "$sha" \
            --arg branch "main" \
            --rawfile content /tmp/content.b64 \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' \
            > /tmp/payload.json

          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/Smart_Form_Filler.user.js" \
            --input /tmp/payload.json \
            >/dev/null

          echo "Smart FormSense v17.9.0 published to main."
