name: One-time Smart FormSense v17.13.2 export reliability fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'release/v17-13-2-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Smart FormSense
        run: python .github/release-v17-13-2/patch.py

      - name: Validate production userscript
        shell: bash
        run: |
          set -euo pipefail
          node --check Smart_Form_Filler.user.js
          grep -q '// @version      17.13.2' Smart_Form_Filler.user.js
          grep -q '// @name         Smart FormSense' Smart_Form_Filler.user.js
          grep -q '// @match        \*://\*/\*' Smart_Form_Filler.user.js
          ! grep -q '@noframes' Smart_Form_Filler.user.js
          grep -q '// @grant        GM_download' Smart_Form_Filler.user.js
          grep -q "window.open('about:blank', '_blank')" Smart_Form_Filler.user.js
          grep -q 'qaReportAgentId' Smart_Form_Filler.user.js
          grep -q 'qaDebugAwaiting' Smart_Form_Filler.user.js
          grep -q 'REMOTE_QA_DEBUG_DATA' Smart_Form_Filler.user.js
          grep -q 'bindQaAction(refs.qaExportBtn' Smart_Form_Filler.user.js
          grep -q 'bindQaAction(refs.qaDebugBtn' Smart_Form_Filler.user.js
          grep -q 'id="qaDownloadPdf"' Smart_Form_Filler.user.js
          grep -q 'GM_download({' Smart_Form_Filler.user.js
          ! grep -q '\.submit(' Smart_Form_Filler.user.js
          ! grep -q '\.requestSubmit(' Smart_Form_Filler.user.js
          test "$(grep -o 'meritto' Smart_Form_Filler.user.js | wc -l)" -eq 1
          grep -q 'akash.singh@meritto.com' Smart_Form_Filler.user.js
          test "$(grep -o 'commitSelectedRadioGroups(' Smart_Form_Filler.user.js | wc -l)" -eq 0

      - name: Publish and remove one-time updater
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-formsense-v17-13-2.yml
          rm -rf .github/release-v17-13-2
          git config user.name 'Akash'
          git config user.email 'avydgupta1234@gmail.com'
          git add -A
          git commit -m 'Release Smart FormSense v17.13.2'
          git push origin HEAD:main
