name: Smart FormSense v17.24.0 public update-source fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sfs-v17-24-public-update.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply public update-source fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          script_path = Path('Smart_Form_Filler.user.js')
          text = script_path.read_text(encoding='utf-8')

          old_version = '17.23.0'
          new_version = '17.24.0'
          if text.count(old_version) < 4:
              raise SystemExit(f'Expected multiple {old_version} userscript references')
          text = text.replace(old_version, new_version)

          text = text.replace(
              '// @connect      raw.githubusercontent.com',
              '// @connect      api.greasyfork.org',
              1
          )
          text = text.replace(
              '// @updateURL    https://raw.githubusercontent.com/akloso/smart-form-filler/main/Smart_Form_Filler.user.js',
              '// @updateURL    https://greasyfork.org/scripts/592133/code/userscript.user.js',
              1
          )
          text = text.replace(
              '// @downloadURL  https://raw.githubusercontent.com/akloso/smart-form-filler/main/Smart_Form_Filler.user.js',
              '// @downloadURL  https://greasyfork.org/scripts/592133/code/userscript.user.js',
              1
          )
          text = text.replace(
              "  const UPDATE_RAW_URL = 'https://raw.githubusercontent.com/akloso/smart-form-filler/main/Smart_Form_Filler.user.js';",
              "  const UPDATE_INFO_URL = 'https://api.greasyfork.org/en/scripts/592133.json';",
              1
          )
          text = text.replace(
              '  const UPDATE_CHECK_INTERVAL_MS = 12 * 60 * 60 * 1000;',
              '  const UPDATE_CHECK_INTERVAL_MS = 24 * 60 * 60 * 1000;',
              1
          )

          parser_pattern = re.compile(
              r"""  const latestVersionFromScript = text => \{.*?\n  \};\n\n  const updateAvailableFrom""",
              re.S
          )
          parser_replacement = "\n".join([
              "  const latestVersionFromGreasyForkInfo = text => {",
              "    try {",
              "      const info = JSON.parse(String(text || '{}'));",
              "      return String(info?.version || '').trim();",
              "    } catch {",
              "      return '';",
              "    }",
              "  };",
              "",
              "  const updateAvailableFrom"
          ])
          text, count = parser_pattern.subn(parser_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not replace version parser')

          old_request = "      const response = await gmTextRequest(`${UPDATE_RAW_URL}?t=${now}`, { timeout: 12000 });"
          new_request = "      const response = await gmTextRequest(`${UPDATE_INFO_URL}?t=${now}`, { timeout: 12000 });"
          if old_request not in text:
              raise SystemExit('Expected raw GitHub update-check request')
          text = text.replace(old_request, new_request, 1)

          old_parse = "      const latestVersion = latestVersionFromScript(response.responseText || '');"
          new_parse = "      const latestVersion = latestVersionFromGreasyForkInfo(response.responseText || '');"
          if old_parse not in text:
              raise SystemExit('Expected current update version parser call')
          text = text.replace(old_parse, new_parse, 1)

          script_path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_current = """**17.23.0**

          v17.23.0 fixes the in-product update flow. Smart FormSense now sends users to the Greasy Fork installation/update page instead of trying to open the raw GitHub userscript as an installer, prevents stale update actions from being shown as actionable, and no longer assumes that returning from the update page means an update was successfully installed."""
          new_current = """**17.24.0**

          v17.24.0 completes the update-flow fix by moving update discovery to Greasy Fork's public API. This removes the browser-side dependency on the repository's raw GitHub URL, keeps update/install navigation on Greasy Fork, and prevents private-source 404 responses from breaking update checks."""
          if old_current not in readme:
              raise SystemExit('Expected v17.23 README current-version block')
          readme = readme.replace(old_current, new_current, 1)

          updates_pattern = re.compile(
              r"""## Updates\n\n.*?\n## Feedback""",
              re.S
          )
          updates_replacement = """## Updates

          Public installation and updates use Greasy Fork:

          `https://greasyfork.org/en/scripts/592133-smart-form-filler`

          Smart FormSense checks the public Greasy Fork JSON API for the currently published version. Automatic checks run at most once per 24 hours; **Check for Updates** can still be run manually.

          The source metadata `@updateURL` and `@downloadURL` also point to the public Greasy Fork userscript endpoint. Greasy Fork may rewrite these metadata keys when publishing, which is expected.

          When an update is available, **Update Smart FormSense** opens the Greasy Fork page. Complete the Tampermonkey update there, then reload any already-open form page so the new userscript version is injected.

          ## Feedback"""
          readme, count = updates_pattern.subn(updates_replacement, readme, count=1)
          if count != 1:
              raise SystemExit('Could not refresh README update section')
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = "## 17.23.0\n"
          entry = """## 17.24.0

          Public update-source reliability fix.

          - Moved in-product update discovery from the repository raw URL to the public Greasy Fork JSON API
          - Added Greasy Fork API access permission for version checks
          - Changed source `@updateURL` / `@downloadURL` metadata to the public Greasy Fork userscript endpoint
          - Kept the in-product Update action on the public Greasy Fork page
          - Changed automatic update-check cadence from 12 hours to 24 hours
          - Removed the remaining browser-side dependency on the private/raw GitHub source for update discovery
          - Existing form-filling, QA, safety, analytics, sharing, iframe, Stop, Undo, and final-submit protection behavior is unchanged

          """
          if marker not in changelog:
              raise SystemExit('Expected v17.23 changelog marker')
          changelog = changelog.replace(marker, entry + marker, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          updated = script_path.read_text(encoding='utf-8')
          checks = [
              ('// @version      17.24.0', 'metadata version'),
              ("const SCRIPT_VERSION = '17.24.0';", 'SCRIPT_VERSION'),
              ('// @connect      api.greasyfork.org', 'Greasy Fork API permission'),
              ("const UPDATE_INFO_URL = 'https://api.greasyfork.org/en/scripts/592133.json';", 'public update info URL'),
              ("const UPDATE_INSTALL_URL = SHARE_INSTALL_URL;", 'Greasy Fork install URL'),
              ('const UPDATE_CHECK_INTERVAL_MS = 24 * 60 * 60 * 1000;', '24-hour update cadence'),
              ('latestVersionFromGreasyForkInfo', 'Greasy Fork version parser'),
              ('GM_openInTab(UPDATE_INSTALL_URL', 'Greasy Fork update navigation')
          ]
          for needle, label in checks:
              if needle not in updated:
                  raise SystemExit(f'Missing {label}')
          if 'UPDATE_RAW_URL' in updated or 'raw.githubusercontent.com' in updated:
              raise SystemExit('Private/raw GitHub update dependency still remains')
          PY

      - name: Validate Greasy Fork API endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          url = 'https://api.greasyfork.org/en/scripts/592133.json'
          with urllib.request.urlopen(url, timeout=15) as response:
              data = json.load(response)
          version = str(data.get('version') or '').strip()
          code_url = str(data.get('code_url') or '').strip()
          if not version:
              raise SystemExit('Greasy Fork API did not return a version')
          if not code_url:
              raise SystemExit('Greasy Fork API did not return a code_url')
          print('Greasy Fork currently published version:', version)
          print('Greasy Fork code URL:', code_url)
          PY

      - name: Syntax and invariant checks
        shell: bash
        run: |
          node --check Smart_Form_Filler.user.js
          git diff --check
          grep -Fq "// @name         Smart FormSense" Smart_Form_Filler.user.js
          grep -Fq "// @version      17.24.0" Smart_Form_Filler.user.js
          grep -Fq "const SCRIPT_VERSION = '17.24.0';" Smart_Form_Filler.user.js
          grep -Fq "const BRIDGE_MARKER = '__STFF_V17_7_BRIDGE__';" Smart_Form_Filler.user.js
          grep -Fq "const FEEDBACK_ENDPOINT = 'https://formspree.io/f/xbgjvoaw';" Smart_Form_Filler.user.js
          grep -Fq "const POSTHOG_HOST = 'https://eu.i.posthog.com';" Smart_Form_Filler.user.js
          grep -Fq "**17.24.0**" README.md
          grep -Fq "## 17.24.0" CHANGELOG.md

      - name: Commit production release and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sfs-v17-24-public-update.yml
          git add Smart_Form_Filler.user.js README.md CHANGELOG.md
          git commit -m "fix: release Smart FormSense v17.24.0 public update source"
          git push origin HEAD:main

      - name: Verify Greasy Fork publish
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          url = 'https://api.greasyfork.org/en/scripts/592133.json'
          target = '17.24.0'
          seen = ''
          for _ in range(18):
              try:
                  with urllib.request.urlopen(url + '?t=' + str(int(time.time())), timeout=15) as response:
                      data = json.load(response)
                  seen = str(data.get('version') or '').strip()
                  print('Greasy Fork version:', seen)
                  if seen == target:
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print('Greasy Fork verification attempt failed:', exc)
              time.sleep(5)

          raise SystemExit(f'Greasy Fork did not publish {target} during verification window; latest seen was {seen or "unknown"}')
          PY
