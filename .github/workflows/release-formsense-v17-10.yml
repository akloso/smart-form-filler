name: One-time Smart FormSense v17.10 functional QA release

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Release Smart FormSense v17.10.0'
    runs-on: ubuntu-latest
    steps:
      - name: Build, validate and publish v17.10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir work
          cd work
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"

          curl -fsSL "$base/Smart_Form_Filler.user.js" -o Smart_Form_Filler.user.js
          curl -fsSL "$base/.github/release-v17-10/build_formsense_17_10.py.gz.b64" -o updater.py.gz.b64

          echo "46ec9042233d754dc8379a2ff321b0a801e54c313d6a6f06e20e4c0991341617  updater.py.gz.b64" | sha256sum -c -
          base64 --decode updater.py.gz.b64 > updater.py.gz
          gzip --decompress --stdout updater.py.gz > build_formsense_17_10.py
          echo "07cec633005be5b098e52dd01c04b63349ff839080ba63c986916206661ba70a  build_formsense_17_10.py" | sha256sum -c -

          python3 build_formsense_17_10.py

          node --check Smart_Form_Filler.user.js
          grep -Fq "// @name         Smart FormSense" Smart_Form_Filler.user.js
          grep -Fq "// @version      17.10.0" Smart_Form_Filler.user.js
          grep -Fq "Black-box Functional Form QA" Smart_Form_Filler.user.js
          grep -Fq "const buildQaFunctionalReport = async () =>" Smart_Form_Filler.user.js
          grep -Fq "const report = await buildQaFunctionalReport();" Smart_Form_Filler.user.js
          grep -Fq "qaReport = await buildQaFunctionalReport();" Smart_Form_Filler.user.js
          grep -Fq "Run Functional QA" Smart_Form_Filler.user.js
          grep -Fq "FUNCTIONAL QA SCORE" Smart_Form_Filler.user.js
          grep -Fq "Export Debug" Smart_Form_Filler.user.js
          grep -Fq "// @match        *://*/*" Smart_Form_Filler.user.js

          if grep -Fq "// @noframes" Smart_Form_Filler.user.js; then
            echo "Unexpected @noframes found."
            exit 1
          fi

          if grep -En '\.(submit|requestSubmit)[[:space:]]*\(' Smart_Form_Filler.user.js; then
            echo "Unexpected final-submit API found."
            exit 1
          fi

          test "$(grep -ci 'meritto' Smart_Form_Filler.user.js)" -eq 1
          grep -Fq "akash.singh@meritto.com" Smart_Form_Filler.user.js
          test "$(grep -c 'commitSelectedRadioGroups' Smart_Form_Filler.user.js)" -eq 1

          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/Smart_Form_Filler.user.js?ref=main" --jq '.sha')"
          base64 -w0 Smart_Form_Filler.user.js > /tmp/content.b64

          jq -n \
            --arg message "Release Smart FormSense v17.10.0 functional QA" \
            --arg sha "$sha" \
            --arg branch "main" \
            --rawfile content /tmp/content.b64 \
            '{message:$message,content:$content,sha:$sha,branch:$branch}' \
            > /tmp/payload.json

          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/Smart_Form_Filler.user.js" \
            --input /tmp/payload.json \
            >/dev/null

          echo "Smart FormSense v17.10.0 published to main."
