name: Smart FormSense v17.25.0 embedded-form reliability fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sfs-v17-25-iframe-reliability.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply embedded-form reliability fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          script_path = Path('Smart_Form_Filler.user.js')
          text = script_path.read_text(encoding='utf-8')

          old_version = '17.24.0'
          new_version = '17.25.0'
          if text.count(old_version) < 4:
              raise SystemExit(f'Expected multiple {old_version} userscript references')
          text = text.replace(old_version, new_version)

          old_constants = """  const FRAME_AGENT_STALE_MS = 12000;
          const REMOTE_COMMAND_TIMEOUT_MS = 42000;
          const QA_REMOTE_COMMAND_TIMEOUT_MS = 300000;"""
          new_constants = """  const FRAME_AGENT_STALE_MS = 12000;
          const REMOTE_AGENT_ACK_TIMEOUT_MS = 1200;
          const REMOTE_AGENT_PING_MS = 900;
          const REMOTE_AGENT_WATCHDOG_MS = 4500;
          const REMOTE_COMMAND_TIMEOUT_MS = 42000;
          const QA_REMOTE_COMMAND_TIMEOUT_MS = 300000;"""
          if old_constants not in text:
              raise SystemExit('Expected embedded-form timing constants')
          text = text.replace(old_constants, new_constants, 1)

          candidates_pattern = re.compile(
              r"""  const embeddedAgentCandidates = \(\) => \{.*?\n  \};\n\n  const discoverEmbeddedAgents =""",
              re.S
          )
          candidates_replacement = """  const embeddedAgentCandidates = (freshAfter = 0) => {
            pruneFrameAgents();

            return [
              ...bridge.agents.values()
            ]
              .filter(
                agent =>
                  agent.metrics?.meaningful &&
                  agent.source &&
                  Number(agent.lastSeen || 0) >= Number(freshAfter || 0)
              )
              .sort(
                (a, b) =>
                  Number(
                    b.metrics?.score || 0
                  ) -
                  Number(
                    a.metrics?.score || 0
                  )
              );
          };

          const discoverEmbeddedAgents ="""
          text, count = candidates_pattern.subn(candidates_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not patch embeddedAgentCandidates')

          old_candidates = """        const candidates =
                  embeddedAgentCandidates();"""
          new_candidates = """        const candidates =
                  embeddedAgentCandidates(started - 25);"""
          if old_candidates not in text:
              raise SystemExit('Expected discovery candidate lookup')
          text = text.replace(old_candidates, new_candidates, 1)

          old_discovery_return = """      return embeddedAgentCandidates();
              };

            const chooseExecutionContext ="""
          new_discovery_return = """      const freshAgents = embeddedAgentCandidates(started - 25);

              if (!freshAgents.length) {
                for (const [id, agent] of bridge.agents) {
                  if (Number(agent.lastSeen || 0) < started - 25) {
                    bridge.agents.delete(id);
                  }
                }
              }

              return freshAgents;
            };

            const chooseExecutionContext ="""
          if old_discovery_return not in text:
              raise SystemExit('Expected discovery return block')
          text = text.replace(old_discovery_return, new_discovery_return, 1)

          send_start = text.index("  const sendRemoteCommand =")
          completion_start = text.index("  const completionDetailFor =", send_start)
          if send_start < 0 or completion_start < 0:
              raise SystemExit('Could not locate sendRemoteCommand block')

          new_send_block = """  const confirmRemoteAgentLive = async (
            agent,
            timeoutMs = REMOTE_AGENT_ACK_TIMEOUT_MS
          ) => {
            if (!agent?.source) return false;

            const started = Date.now();

            try {
              agent.source.postMessage(
                bridgePayload(
                  'DISCOVER',
                  {
                    sessionId: bridge.sessionId,
                    at: started
                  }
                ),
                '*'
              );
            } catch {
              return false;
            }

            while (Date.now() - started < timeoutMs) {
              await sleep(90);

              const current = bridge.agents.get(agent.id);

              if (
                current?.source === agent.source &&
                Number(current.lastSeen || 0) >= started
              ) {
                return true;
              }
            }

            return false;
          };

          const sendRemoteCommand =
            async (
              agent,
              action,
              extra = {}
            ) => {
              if (!agent?.source) {
                throw new Error(
                  'Embedded form frame is no longer available'
                );
              }

              const live =
                await confirmRemoteAgentLive(
                  agent
                );

              if (!live) {
                bridge.agents.delete(
                  agent.id
                );

                throw new Error(
                  'Embedded form closed or became unavailable. Reopen the form and try again.'
                );
              }

              const authorization = serializedActiveAuthorization();

              if (!authorization || authorization.kind !== canonicalActionKind(action)) {
                throw new Error('No authorized Smart FormSense action is active');
              }

              const requestId =
                makeBridgeId(
                  'request'
                );

              state.activeRemoteAgentId =
                agent.id;

              state.lastRemoteAgentId =
                agent.id;

              state.activeRemoteRequestId =
                requestId;

              state.activeRemoteAction =
                action;

              state.running =
                true;

              state.stopRequested =
                false;

              state.panel?.setBusy(
                true
              );

              state.panel?.setStatus(
                `Running ${action} inside embedded form${agent.hostname ? ` • ${agent.hostname}` : ''}...`
              );

              return new Promise(
                (
                  resolve,
                  reject
                ) => {
                  let watchdog = null;

                  const clearRemoteWaiters = () => {
                    clearTimeout(
                      timer
                    );

                    if (watchdog) {
                      clearInterval(
                        watchdog
                      );

                      watchdog = null;
                    }
                  };

                  const failRemoteCommand = message => {
                    if (!bridge.pending.has(requestId)) return;

                    bridge.pending.delete(
                      requestId
                    );

                    clearRemoteWaiters();

                    if (
                      state.activeRemoteRequestId ===
                      requestId
                    ) {
                      state.running =
                        false;

                      state.activeRemoteAgentId =
                        null;

                      state.activeRemoteRequestId =
                        null;

                      state.activeRemoteAction =
                        null;

                      state.panel?.setBusy(
                        false
                      );
                    }

                    reject(
                      new Error(
                        message
                      )
                    );
                  };

                  const timer =
                    setTimeout(
                      () => {
                        failRemoteCommand(
                          'Embedded form stopped responding before the command completed'
                        );
                      },
                      action === 'qa-audit'
                        ? QA_REMOTE_COMMAND_TIMEOUT_MS
                        : REMOTE_COMMAND_TIMEOUT_MS
                    );

                  bridge.pending.set(
                    requestId,
                    {
                      resolve,
                      reject,
                      timer,
                      get watchdog() { return watchdog; },
                      clearRemoteWaiters,
                      agentId:
                        agent.id,
                      action
                    }
                  );

                  watchdog =
                    setInterval(
                      () => {
                        const current =
                          bridge.agents.get(
                            agent.id
                          );

                        const lastSeen =
                          Number(
                            current?.lastSeen || 0
                          );

                        if (
                          !current?.source ||
                          current.source !== agent.source ||
                          Date.now() - lastSeen >
                            REMOTE_AGENT_WATCHDOG_MS
                        ) {
                          bridge.agents.delete(
                            agent.id
                          );

                          failRemoteCommand(
                            'Embedded form closed or became unavailable. Reopen the form and try again.'
                          );

                          return;
                        }

                        try {
                          agent.source.postMessage(
                            bridgePayload(
                              'DISCOVER',
                              {
                                sessionId:
                                  bridge.sessionId,
                                at:
                                  Date.now()
                              }
                            ),
                            '*'
                          );
                        } catch {
                          failRemoteCommand(
                            'Embedded form closed or became unavailable. Reopen the form and try again.'
                          );
                        }
                      },
                      REMOTE_AGENT_PING_MS
                    );

                  try {
                    agent.source.postMessage(
                      bridgePayload(
                        'COMMAND',
                        {
                          sessionId:
                            bridge.sessionId,
                          agentId:
                            agent.id,
                          requestId,
                          action,
                          authorization,
                          ...extra
                        }
                      ),
                      '*'
                    );
                  } catch (error) {
                    failRemoteCommand(
                      error?.message ||
                      'Embedded form command could not be sent'
                    );
                  }
                }
              );
            };

"""
          text = text[:send_start] + new_send_block + text[completion_start:]

          old_result_cleanup = """          if (pending) {
                    clearTimeout(
                      pending.timer
                    );

                    bridge.pending.delete(
                      requestId
                    );"""
          new_result_cleanup = """          if (pending) {
                    if (typeof pending.clearRemoteWaiters === 'function') {
                      pending.clearRemoteWaiters();
                    } else {
                      clearTimeout(
                        pending.timer
                      );

                      if (pending.watchdog) {
                        clearInterval(
                          pending.watchdog
                        );
                      }
                    }

                    bridge.pending.delete(
                      requestId
                    );"""
          if old_result_cleanup not in text:
              raise SystemExit('Expected remote-result cleanup block')
          text = text.replace(old_result_cleanup, new_result_cleanup, 1)

          old_pending_resolve = """            pending.resolve(
                      data
                    );"""
          new_pending_resolve = """            if (data.ok === false) {
                      pending.reject(
                        new Error(
                          data.status ||
                          `Embedded ${pending.action || 'action'} stopped safely`
                        )
                      );
                    } else {
                      pending.resolve(
                        data
                      );
                    }"""
          if old_pending_resolve not in text:
              raise SystemExit('Expected remote-result resolve block')
          text = text.replace(old_pending_resolve, new_pending_resolve, 1)

          shadow_marker = """    const shadow = host.attachShadow({ mode: 'open' });

              shadow.innerHTML = `"""
          shadow_insert = """    const shadow = host.attachShadow({ mode: 'open' });

              // Keep Smart FormSense UI interactions inside its own shadow UI.
              // Many host sites close application/enquiry modals on a document-level
              // outside click; bubbling panel events must not look like page clicks.
              const isolatePanelEvent = event => {
                try {
                  event.stopPropagation();
                } catch {}
              };

              [
                'pointerdown',
                'pointerup',
                'pointercancel',
                'mousedown',
                'mouseup',
                'click',
                'dblclick',
                'touchstart',
                'touchend',
                'contextmenu'
              ].forEach(type => {
                shadow.addEventListener(
                  type,
                  isolatePanelEvent,
                  false
                );

                host.addEventListener(
                  type,
                  isolatePanelEvent,
                  false
                );
              });

              shadow.innerHTML = `"""
          if shadow_marker not in text:
              raise SystemExit('Could not locate panel shadow creation')
          text = text.replace(shadow_marker, shadow_insert, 1)

          script_path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          current_pattern = re.compile(
              r"""## Current production version\n\n\*\*17\.24\.0\*\*\n\n.*?\n\n## Core product rules""",
              re.S
          )
          current_replacement = """## Current production version

          **17.25.0**

          v17.25.0 hardens embedded/cross-origin form handling. Smart FormSense now isolates panel interactions from host-page outside-click handlers, requires a fresh iframe response before routing an action, watches active embedded forms for disappearance, and fails quickly and safely if an embedded form closes or becomes unavailable.

          ## Core product rules"""
          readme, count = current_pattern.subn(current_replacement, readme, count=1)
          if count != 1:
              raise SystemExit('Could not update README current-version block')
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = "## 17.24.0\n"
          entry = """## 17.25.0

          Embedded-form lifecycle and modal-interaction reliability fix.

          - Isolated Smart FormSense panel pointer/click/touch events so host-page outside-click handlers do not normally treat panel interaction as a page click
          - Required a fresh iframe/frame-agent response during embedded-form discovery instead of trusting a recently cached agent
          - Added a pre-command liveness acknowledgement before Fill, Validate, Recheck, QA, and embedded Undo actions
          - Added an active embedded-form watchdog that pings the frame while a remote action is running
          - If the iframe closes or disappears, Smart FormSense now stops safely within a few seconds instead of waiting for the full remote-command timeout
          - Stale embedded agents are dropped after an unsuccessful discovery pass
          - Remote results with `ok: false` are now surfaced as failures instead of being treated as successful completion
          - Existing form-filling logic, synthetic-data rules, existing-value protection, Stop, Undo, analytics, sharing, and final-submit/payment safety behavior remain unchanged

          """
          if marker not in changelog:
              raise SystemExit('Expected v17.24 changelog marker')
          changelog = changelog.replace(marker, entry + marker, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          updated = script_path.read_text(encoding='utf-8')
          checks = [
              ('// @version      17.25.0', 'metadata version'),
              ("const SCRIPT_VERSION = '17.25.0';", 'SCRIPT_VERSION'),
              ('const REMOTE_AGENT_ACK_TIMEOUT_MS = 1200;', 'remote acknowledgement timeout'),
              ('const REMOTE_AGENT_PING_MS = 900;', 'remote ping interval'),
              ('const REMOTE_AGENT_WATCHDOG_MS = 4500;', 'remote watchdog timeout'),
              ('const confirmRemoteAgentLive = async', 'remote liveness preflight'),
              ('embeddedAgentCandidates(started - 25)', 'fresh embedded-agent discovery'),
              ("'Embedded form closed or became unavailable. Reopen the form and try again.'", 'fast iframe disappearance error'),
              ('const isolatePanelEvent = event =>', 'panel event isolation'),
              ('if (data.ok === false)', 'remote failure propagation')
          ]
          for needle, label in checks:
              if needle not in updated:
                  raise SystemExit(f'Missing {label}')
          PY

      - name: Syntax and invariant checks
        shell: bash
        run: |
          node --check Smart_Form_Filler.user.js
          git diff --check
          grep -Fq "// @name         Smart FormSense" Smart_Form_Filler.user.js
          grep -Fq "// @version      17.25.0" Smart_Form_Filler.user.js
          grep -Fq "const SCRIPT_VERSION = '17.25.0';" Smart_Form_Filler.user.js
          grep -Fq "const BRIDGE_MARKER = '__STFF_V17_7_BRIDGE__';" Smart_Form_Filler.user.js
          grep -Fq "const FEEDBACK_ENDPOINT = 'https://formspree.io/f/xbgjvoaw';" Smart_Form_Filler.user.js
          grep -Fq "const POSTHOG_HOST = 'https://eu.i.posthog.com';" Smart_Form_Filler.user.js
          grep -Fq "const UPDATE_INFO_URL = 'https://api.greasyfork.org/en/scripts/592133.json';" Smart_Form_Filler.user.js
          grep -Fq "**17.25.0**" README.md
          grep -Fq "## 17.25.0" CHANGELOG.md

      - name: Commit production release and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sfs-v17-25-iframe-reliability.yml
          git add Smart_Form_Filler.user.js README.md CHANGELOG.md
          git commit -m "fix: release Smart FormSense v17.25.0 iframe reliability"
          git push origin HEAD:main

      - name: Verify Greasy Fork synchronization
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          url = 'https://api.greasyfork.org/en/scripts/592133.json'
          target = '17.25.0'
          seen = ''

          for _ in range(24):
              try:
                  with urllib.request.urlopen(url + '?t=' + str(int(time.time())), timeout=15) as response:
                      data = json.load(response)
                  seen = str(data.get('version') or '').strip()
                  print('Greasy Fork version:', seen)
                  if seen == target:
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as exc:
                  print('Greasy Fork verification attempt failed:', exc)
              time.sleep(5)

          raise SystemExit(f'Greasy Fork did not publish {target} during verification window; latest seen was {seen or "unknown"}')
          PY
